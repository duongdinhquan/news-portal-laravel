services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_portal_app
    restart: unless-stopped
    working_dir: /var/www/html
    # Laravel loads the mounted .env file itself. Do not use env_file here: empty APP_KEY/JWT_SECRET
    # values would be frozen in the container environment before the entrypoint generates them.
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-news_portal}
      DB_USERNAME: ${DB_USERNAME:-news_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - public_build:/var/www/html/public/build
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - news_network

  nginx:
    image: nginx:stable-alpine
    container_name: news_portal_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html:ro
      - vendor_data:/var/www/html/vendor:ro
      - public_build:/var/www/html/public/build:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - news_network

  mysql:
    image: mysql:8.4
    container_name: news_portal_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-news_portal}
      MYSQL_USER: ${DB_USERNAME:-news_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - news_network

networks:
  news_network:
    driver: bridge

volumes:
  mysql_data:
  app_storage:
  vendor_data:
  public_build:
